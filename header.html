<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Header Responsive</title>
  <style>
    /* Reset básico */
    * {box-sizing: border-box; margin: 0; padding: 0}
    body {font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; line-height: 1.4}

    /* Header */
    .site-header {
      background: #0b74de; /* color principal */
      color: #fff;
      padding: 0.5rem 1rem;
      position: relative;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: inherit;
    }
    .brand .logo {
      width: 40px;
      height: 40px;
      background: #fff;
      color: #0b74de;
      display: inline-grid;
      place-items: center;
      font-weight: 700;
      border-radius: 6px;
      flex: 0 0 40px;
    }
    .brand .site-title {font-size: 1.05rem; font-weight: 600}

    /* Navegación */
    .main-nav {
      display: flex;
      align-items: center;
    }
    .main-nav ul {
      display: flex;
      gap: 1rem;
      list-style: none;
    }
    .main-nav a {
      color: #fff;
      text-decoration: none;
      padding: 0.5rem 0.6rem;
      border-radius: 4px;
    }
    .main-nav a:hover, .main-nav a:focus {
      background: rgba(255,255,255,0.12);
      outline: none;
    }

    /* Botón hamburguesa para móvil */
    .nav-toggle {
      display: none;
      background: transparent;
      border: 2px solid transparent;
      color: #fff;
      padding: 0.4rem;
      border-radius: 6px;
    }
    .nav-toggle:focus {outline: 2px solid rgba(255,255,255,0.3)}

    /* Estilos móviles */
    @media (max-width: 768px) {
      .main-nav {position: absolute; left: 0; right: 0; top: 100%; background: #0b74de; display: none;}
      .main-nav[aria-hidden="false"] {display: block}
      .main-nav ul {flex-direction: column; padding: 0.5rem 1rem}
      .nav-toggle {display: inline-block}
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="#" class="brand" aria-label="Inicio">
      <span class="logo">C</span>
      <span class="site-title">Proyecto Creser</span>
    </a>

    <nav class="main-nav" id="main-nav" aria-hidden="true">
      <ul>
        <li><a href="#home">Inicio</a></li>
        <li><a href="#about">Sobre</a></li>
        <li><a href="#services">Servicios</a></li>
        <li><a href="#contact">Contacto</a></li>
      </ul>
    </nav>

    <button class="nav-toggle" id="nav-toggle" aria-controls="main-nav" aria-expanded="false" aria-label="Abrir menú">
      <!-- Ícono simple: tres líneas -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
        <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</header>



</body>
</html>
